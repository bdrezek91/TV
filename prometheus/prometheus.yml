global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: bybit-collector
    static_configs:
      - targets: ["bybit-collector:9100"]

  - job_name: analysis-worker
    static_configs:
      - targets: ["analysis-worker:9101"]

  - job_name: paper-broker
    static_configs:
      - targets: ["paper-broker:9102"]
