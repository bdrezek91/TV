name: Backtest Comparison CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  comparison-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.11'
      - name: Install package and test dependencies
        run: uv sync --dev --locked
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Run Ruff
        run: uv run ruff check .
      - name: Run comparison and TradingView regression tests
        run: uv run pytest -v
      - name: Validate research CLIs import and parse
        run: |
          uv run python scripts/research/backtest_comparison_v1.py --help >/dev/null
          uv run python scripts/research/backtest_comparison_guarded_v1.py --help >/dev/null
          uv run python scripts/research/backfill_extended_history_v1.py --help >/dev/null
          uv run python scripts/research/backtest_comparison_extended_v1.py --help >/dev/null
          uv run python scripts/research/backtest_research_v2_candidate_v1.py --help >/dev/null
          uv run python scripts/research/backtest_research_v2_candidate_v2.py --help >/dev/null
          uv run python scripts/research/backtest_research_v2_candidate_v3_setup_isolation.py --help >/dev/null
          uv run python scripts/research/backtest_research_v2_candidate_v4_mean_reversion_forensics.py --help >/dev/null
          uv run python scripts/research/backtest_research_v2_candidate_v5_fakeout.py --help >/dev/null
          uv run python scripts/research/backtest_research_v2_candidate_v6_momentum.py --help >/dev/null
          uv run python scripts/research/backtest_research_v2_candidate_v7_cvd_divergence.py --help >/dev/null
          uv run python scripts/research/backtest_research_v2_candidate_v8_vwap_reversion.py --help >/dev/null
          uv run python scripts/research/backtest_research_v2_candidate_v9_volatility_expansion.py --help >/dev/null
          uv run python scripts/research/backtest_research_v2_final_discovery_v10_v12.py --help >/dev/null
          uv run python scripts/research/backtest_research_v2_mean_reversion_holdout_v1.py --help >/dev/null
          uv run python scripts/research/backtest_research_v2_mean_reversion_v2_development.py --help >/dev/null
          uv run python scripts/research/backtest_research_v2_mean_reversion_v2_holdout_120d.py --help >/dev/null
          uv run python scripts/research/backtest_research_v13_breakout_development.py --help >/dev/null
          uv run python scripts/research/backtest_research_v14_breakout_development.py --help >/dev/null
          uv run python scripts/research/export_mean_reversion_v1_postmortem.py --help >/dev/null
          uv run python scripts/research/validate_extended_cache_no_lookahead.py --help >/dev/null
          uv run python scripts/research/validate_bybit_data_fidelity.py --help >/dev/null
          uv run python scripts/research/adjudicate_bybit_trade_volume_mismatches.py --help >/dev/null
          uv run python scripts/research/diagnose_research_v2_cadence_v1.py --help >/dev/null
          uv run python scripts/research/render_backtest_comparison_report_v1.py --help >/dev/null
          uv run python -c 'from tradingview_mcp.workers.orderbook_maintenance_main import policy_from_env; policy_from_env()'
